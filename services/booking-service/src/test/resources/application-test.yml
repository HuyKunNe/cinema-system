spring:
  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:h2:mem:booking_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    enabled: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

eureka:
  client:
    enabled: false

cinema:
  booking:
    reservation-expiration: 10m
    max-seats-per-booking: 10

  security:
    oauth2:
      issuer-uri: https://identity.cinema.test
      jwk-set-uri: https://identity.cinema.test/oauth2/jwks
      audience: cinema-api
