spring:
  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:h2:mem:booking_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    enabled: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

eureka:
  client:
    enabled: false

cinema:
  booking:
    reservation-expiration: 10m
    maximum-seat-count: 10

  outbox:
    producer: booking-service
    batch-size: 100
    scheduler-delay: 5s
    lease-duration: 30s
    maximum-attempts: 5
    base-retry-delay: 1s
    maximum-retry-delay: 1m
    maximum-jitter: 0ms
  security:
    oauth2:
      issuer-uri: https://identity.cinema.test
      jwk-set-uri: https://identity.cinema.test/oauth2/jwks
      audience: cinema-api
