spring:
    cloud:
        config:
            enabled: false

    datasource:
        url: jdbc:h2:mem:user_service_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
        username: sa
        password:
        driver-class-name: org.h2.Driver

    flyway:
        enabled: false

    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: none
        properties:
            hibernate:
                format_sql: false
                jdbc:
                    time_zone: UTC

eureka:
    client:
        enabled: false
