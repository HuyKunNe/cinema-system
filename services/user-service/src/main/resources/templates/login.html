<!doctype html>
<html lang="vi" xmlns:th="https://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng nhập | CINEMATIC</title>
    <link rel="stylesheet" th:href="@{/css/cinema-login.css}" />
  </head>

  <body>
    <a class="skip-link" href="#main-content">Chuyển đến nội dung chính</a>

    <header class="site-header">
      <a class="brand" href="/" aria-label="Cinematic, về trang chủ">
        <span class="brand__mark" aria-hidden="true">C</span>
        <span class="brand__name">CINEMATIC</span>
      </a>
    </header>

    <main id="main-content" class="login-page" tabindex="-1">
      <section class="login-card" aria-labelledby="login-title">
        <p class="login-card__eyebrow">Tài khoản Cinematic</p>
        <h1 id="login-title" class="login-card__title">Chào mừng trở lại</h1>
        <p class="login-card__description">
          Đăng nhập để quản lý vé và tiếp tục đặt chỗ.
        </p>

        <div th:if="${param.error}" class="alert alert--error" role="alert">
          Tên đăng nhập hoặc mật khẩu không đúng.
        </div>

        <div th:if="${param.logout}" class="alert alert--success" role="status">
          Bạn đã đăng xuất thành công.
        </div>

        <form
          id="login-form"
          class="login-form"
          th:action="@{/login}"
          method="post"
          autocomplete="on"
        >
          <div class="form-field">
            <label for="username">Tên đăng nhập hoặc email</label>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              required
              autofocus
            />
          </div>

          <div class="form-field">
            <label for="password">Mật khẩu</label>
            <div class="password-control">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
              <button
                id="password-toggle"
                class="password-toggle"
                type="button"
                aria-controls="password"
                aria-pressed="false"
              >
                Hiện
              </button>
            </div>
          </div>

          <button id="login-submit" class="submit-button" type="submit">
            <span class="submit-button__label">Đăng nhập</span>
          </button>
        </form>

        <p class="security-note">
          Thông tin đăng nhập được xử lý trực tiếp bởi hệ thống định danh
          Cinematic.
        </p>
      </section>
    </main>

    <footer class="site-footer">Điện ảnh kết nối cảm xúc</footer>

    <script>
      const passwordInput = document.querySelector("#password");
      const passwordToggle = document.querySelector("#password-toggle");
      const loginForm = document.querySelector("#login-form");
      const submitButton = document.querySelector("#login-submit");
      const submitLabel = submitButton.querySelector(".submit-button__label");

      passwordToggle.addEventListener("click", () => {
        const showPassword = passwordInput.type === "password";
        passwordInput.type = showPassword ? "text" : "password";
        passwordToggle.textContent = showPassword ? "Ẩn" : "Hiện";
        passwordToggle.setAttribute("aria-pressed", String(showPassword));
      });

      loginForm.addEventListener("submit", () => {
        submitButton.disabled = true;
        submitButton.setAttribute("aria-busy", "true");
        submitLabel.textContent = "Đang đăng nhập…";
      });
    </script>
  </body>
</html>
