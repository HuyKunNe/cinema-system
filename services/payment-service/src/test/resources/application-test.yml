spring:
  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:h2:mem:payment_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    enabled: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
eureka:
  client:
    enabled: false

cinema:
  security:
    oauth2:
      issuer-uri: https://identity.cinema.test
      jwk-set-uri: https://identity.cinema.test/oauth2/jwks
      audience: cinema-api
  payment:
    provider: MOCK
    kafka:
      enabled: false
      topics:
        payment-requested: payment-requested
      consumer-groups:
        payment-requested: payment-request-processing-test
      retry:
        interval: 10ms
        maximum-retries: 2
