server:
  port: ${PAYMENT_SERVICE_PORT:8085}

spring:
  application:
    name: payment-service

  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

  datasource:
    url: ${PAYMENT_DB_URL:jdbc:mysql://localhost:3306/cinema_payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    disable-swagger-default-url: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.cinema.payment: INFO
    com.netflix.discovery: INFO

cinema:
  security:
    oauth2:
      issuer-uri: ${CINEMA_AUTH_ISSUER}
      jwk-set-uri: ${CINEMA_AUTH_JWK_SET_URI}
      audience: ${CINEMA_AUTH_AUDIENCE:cinema-api}
  payment:
    provider: ${PAYMENT_PROVIDER:MOCK}
    provider-operation:
      batch-size: ${PAYMENT_PROVIDER_OPERATION_BATCH_SIZE:20}
      lease-duration: ${PAYMENT_PROVIDER_OPERATION_LEASE_DURATION:30s}
    kafka:
      enabled: ${PAYMENT_KAFKA_ENABLED:true}
      topics:
        payment-requested: ${PAYMENT_REQUESTED_TOPIC:payment-requested}
      consumer-groups:
        payment-requested: ${PAYMENT_REQUESTED_CONSUMER_GROUP:payment-request-processing}
      retry:
        interval: ${PAYMENT_KAFKA_RETRY_INTERVAL:1s}
        maximum-retries: ${PAYMENT_KAFKA_MAXIMUM_RETRIES:3}
    webhook:
      maximum-body-size: ${PAYMENT_PROVIDER_WEBHOOK_MAXIMUM_BODY_SIZE:64KB}
